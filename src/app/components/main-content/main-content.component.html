<div [ngClass]="{'full-width': !isSidebarVisible}">
  <mat-toolbar class="toolbar">
    <div class="brand">
      <button mat-icon-button (click)="onToggleSidebar()" class="brand-mark" aria-label="Toggle document sidebar">
        <span>S</span>
      </button>
      <h1>SDLC Mate</h1>
    </div>
    <div class="toolbar-actions">
      <button mat-icon-button type="button" (click)="toggleThemeMode()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button aria-label="Help">
        <mat-icon>help_outline</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <mat-tab-group class="tabs-container" [selectedIndex]="selectedTabIndex" (selectedIndexChange)="onTabChanged($event)">
    <mat-tab label="User Story Creation">
      <app-user-story-tab [uploadedDocument]="uploadedDocument" (userStoriesGenerated)="onUserStoriesGenerated($event)"></app-user-story-tab>
    </mat-tab>
    <mat-tab label="User Story to Test Case">
      <app-test-case-tab [uploadedDocument]="uploadedDocument" [generatedUserStories]="generatedUserStories"></app-test-case-tab>
    </mat-tab>
    <mat-tab label="Test Case to Cucumber Script">
      <app-cucumber-tab [uploadedDocument]="uploadedDocument"></app-cucumber-tab>
    </mat-tab>
    <mat-tab label="Test Case to Selenium Script">
      <app-selenium-tab [uploadedDocument]="uploadedDocument"></app-selenium-tab>
    </mat-tab>
  </mat-tab-group>
</div>
