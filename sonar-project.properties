# =====================================================================
# SonarQube Project Configuration - SDLC Frontend
# =====================================================================

sonar.projectKey=sdlc-mate-frontend
sonar.projectName=SDLC Mate Frontend
sonar.projectVersion=1.0.0

# Path configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,src/typings.d.ts,src/environments/environment*.ts

# Encoding & Environment
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser

# TypeScript compiler configuration
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Quality Gate & Security Analysis
sonar.qualitygate.wait=true
